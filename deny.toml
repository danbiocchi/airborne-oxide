# SPDX-License-Identifier: AGPL-3.0-or-later
# Dependency policy (DESIGN §10). Checked in CI with cargo-deny.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences only, so dual licensing stays possible. MPL-2.0 is
# allowed only as an exception for simulator/tool crates, never for
# oxide-core or firmware (none is needed yet).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.93
# The allow list is policy, not an inventory: entries may be unused today.
unused-allowed-license = "allow"

# Our own crates are AGPL-3.0-or-later and unpublished; they are not
# third-party dependencies.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
