[package]
name = "oxide-log"
description = "Airborne Oxide logs: the ULog format layer, the flight core's topics, the recorder, the reader"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Adds the reader, the format-string parser and the `Vec<u8>` sink (everything that allocates).
std = []

[dependencies]
# Used only by the topic layer (`topics`, `header`, `recorder`, `replay`).
# The format layer (`msg`, `record`, `logger`, `format`, `reader`) stays free of it.
oxide-core = { path = "../oxide-core" }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
