[package]
name = "oxide-store"
description = "Airborne Oxide key-value store over two flash sectors, safe against power loss"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Adds `std::error::Error` impls and the `SimFlash` test flash (no other use of std).
std = []

[dependencies]
# Used only by `param_store` (the parameter policy); the generic store does not
# know it. Both crates are `no_std`.
oxide-core.workspace = true

[lints]
workspace = true
