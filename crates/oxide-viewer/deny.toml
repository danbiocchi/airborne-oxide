# SPDX-License-Identifier: AGPL-3.0-or-later
# Dependency policy for the viewer (a tool crate). Same as the root
# deny.toml, plus per-crate exceptions DESIGN §10 allows for tool crates.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"
exceptions = [
    # MPL-2.0 is allowed in simulator and tool crates as unmodified
    # crates.io dependencies, never in oxide-core or firmware (DESIGN §10).
    # Both arrive through Rerun.
    { crate = "indent", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
    # Mozilla's CA certificate list, distributed under a permissive data
    # licence; arrives through Rerun's HTTP client.
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
