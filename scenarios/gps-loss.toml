# SPDX-License-Identifier: AGPL-3.0-or-later
name = "gps-loss"
about = "GPS lost for good in Offboard: Hold, then after gps_loss_land_s (shortened to 10 s) Land, and it lands within 40 m of home."
airframe = "quad-x-5in"
duration_s = 70.0

[sim]
sensors = "realistic"
estimator = "ekf"

[sim.links]
gcs = false
brain = true
rc_failsafe_delay_us = 1000000

[wind]
kind = "random"
steady_speed_mps = [0.0, 2.0]
sigma_h_mps = [0.1, 0.4]
sigma_v_ratio = 0.5
tau_s = 2.0

[params]
FS_GPS_LAND = 10.0

[[fault]]
kind = "gps-loss"
start_s = 15.0

[pilot]
arm_at_s = 3.0

[[pilot.mode]]
t = 0.0
switch = "offboard"

[[pilot.setpoint]]
t = 0.0
position = [0.0, 0.0, 0.0]
yaw = 0.0

[[pilot.setpoint]]
t = 4.0
position = [0.0, 0.0, 5.0]
yaw = 0.0

[expect]
nav_contains = ["hold", "land"]
reasons = ["GPS_LOST"]
by_s = 65.0
max_touchdown_mps = 1.5
max_tilt_deg = 40.0
min_height_m = 4.0

[expect.ending]
kind = "landed"
within_m_of_home = 40.0

[run]
seeds = 10
profiles = ["f405", "h743"]
