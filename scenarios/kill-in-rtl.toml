# SPDX-License-Identifier: AGPL-3.0-or-later
name = "kill-in-rtl"
about = "Radio lost in Position and back during the return, then the pilot hits the kill switch: disarms with the motors off."
airframe = "quad-x-5in"
duration_s = 50.0

[sim]
sensors = "realistic"
estimator = "ekf"

[sim.links]
gcs = false
brain = true
rc_failsafe_delay_us = 1000000

[wind]
kind = "random"
steady_speed_mps = [0.0, 2.0]
sigma_h_mps = [0.1, 0.4]
sigma_v_ratio = 0.5
tau_s = 2.0

[[fault]]
kind = "rc-loss"
start_s = 25.0
end_s = 32.0

[pilot]
arm_at_s = 3.0
kill_at_s = 34.0

[[pilot.mode]]
t = 0.0
switch = "position"

[[pilot.sticks]]
t = 0.0
roll = 0.0
pitch = 0.0
yaw = 0.0
throttle = 0.0

[[pilot.sticks]]
t = 3.5
roll = 0.0
pitch = 0.0
yaw = 0.0
throttle = 1.0

[[pilot.sticks]]
t = 5.2
roll = 0.0
pitch = 0.0
yaw = 0.0
throttle = 0.5

[[pilot.sticks]]
t = 8.0
roll = 0.0
pitch = 0.6
yaw = 0.0
throttle = 0.5

[[pilot.sticks]]
t = 13.0
roll = 0.0
pitch = 0.0
yaw = 0.0
throttle = 0.5

[[pilot.setpoint]]
t = 0.0
position = [0.0, 0.0, 0.0]
yaw = 0.0

[expect]
nav_contains = ["hold", "rtl"]
reasons = ["RC_LOST"]
by_s = 36.0
max_touchdown_mps = 1.5
max_tilt_deg = 40.0
min_height_m = 4.0

[expect.ending]
kind = "disarmed"
reason = "kill"

[run]
seeds = 10
profiles = ["f405", "h743"]
