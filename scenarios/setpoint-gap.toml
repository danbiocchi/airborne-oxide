# SPDX-License-Identifier: AGPL-3.0-or-later
name = "setpoint-gap"
about = "The brain sends no setpoints for 3 s but its heartbeat continues: Hold while they are stale, then Offboard again."
airframe = "quad-x-5in"
duration_s = 40.0

[sim]
sensors = "realistic"
estimator = "ekf"

[sim.links]
gcs = false
brain = true
rc_failsafe_delay_us = 1000000

[wind]
kind = "random"
steady_speed_mps = [0.0, 2.0]
sigma_h_mps = [0.1, 0.4]
sigma_v_ratio = 0.5
tau_s = 2.0

[pilot]
arm_at_s = 3.0

[[pilot.mode]]
t = 0.0
switch = "offboard"

[[pilot.setpoint]]
t = 0.0
position = [0.0, 0.0, 0.0]
yaw = 0.0

[[pilot.setpoint]]
t = 4.0
position = [0.0, 0.0, 5.0]
yaw = 0.0

[[pilot.setpoint]]
t = 15.0
silent = true

[[pilot.setpoint]]
t = 18.0
position = [0.0, 0.0, 5.0]
yaw = 0.0

[expect]
nav_contains = ["offboard", "hold", "offboard"]
nav_never = ["rtl", "land", "land-now", "terminated"]
reasons = ["SETPOINT_STALE"]
reasons_never = ["RC_LOST", "NO_HUMAN_LINK", "BRAIN_LOST", "BATTERY_LOW", "BATTERY_CRITICAL", "GPS_LOST", "ESTIMATOR_UNHEALTHY", "IMU_FAILURE", "GEOFENCE", "LOSS_OF_CONTROL"]
by_s = 40.0
max_touchdown_mps = 1.5
max_tilt_deg = 40.0
min_height_m = 4.0

[expect.ending]
kind = "flying"
point = [0.0, 0.0, 5.0]
tolerance_m = 1.5

[run]
seeds = 10
profiles = ["f405", "h743"]
