# SPDX-License-Identifier: AGPL-3.0-or-later
name = "battery-low"
about = "A battery runs down to its low level 15 m out (about 25 s) and never to critical: Rtl flies back, and lands at home."
airframe = "quad-x-5in"
duration_s = 70.0

[sim]
sensors = "realistic"
estimator = "ekf"

[sim.links]
gcs = false
brain = true
rc_failsafe_delay_us = 1000000

[wind]
kind = "random"
steady_speed_mps = [0.0, 2.0]
sigma_h_mps = [0.1, 0.4]
sigma_v_ratio = 0.5
tau_s = 2.0

[battery]
capacity_mah = 4000.0
initial_state_of_charge = 0.0614

[pilot]
arm_at_s = 3.0

[[pilot.mode]]
t = 0.0
switch = "offboard"

[[pilot.setpoint]]
t = 0.0
position = [0.0, 0.0, 0.0]
yaw = 0.0

[[pilot.setpoint]]
t = 4.0
position = [15.0, 0.0, 5.0]
yaw = 0.0

[expect]
nav_contains = ["rtl"]
nav_never = ["land-now"]
reasons = ["BATTERY_LOW"]
reasons_never = ["BATTERY_CRITICAL"]
by_s = 55.0
max_touchdown_mps = 1.5
max_tilt_deg = 40.0
min_height_m = 4.0

[expect.ending]
kind = "landed"
within_m_of_home = 2.0

[run]
seeds = 10
profiles = ["f405", "h743"]
