name = "rc-loss-on-ground"
about = "Radio lost while armed on the ground in Stabilized: disarms at once and never leaves the ground."
airframe = "quad-x-5in"
duration_s = 12.0

[sim]
sensors = "realistic"
estimator = "ekf"

[sim.links]
gcs = false
brain = true
rc_failsafe_delay_us = 1000000

[wind]
kind = "random"
steady_speed_mps = [0.0, 2.0]
sigma_h_mps = [0.1, 0.4]
sigma_v_ratio = 0.5
tau_s = 2.0

[[fault]]
kind = "rc-loss"
start_s = 6.0

[pilot]
arm_at_s = 3.0

[[pilot.mode]]
t = 0.0
switch = "stabilized"

[[pilot.setpoint]]
t = 0.0
position = [0.0, 0.0, 0.0]
yaw = 0.0

[expect]
reasons = ["RC_LOST"]
by_s = 6.5
max_touchdown_mps = 1.5
max_tilt_deg = 40.0
max_height_m = 0.2

[expect.ending]
kind = "landed"
within_m_of_home = 0.5

[run]
seeds = 10
profiles = ["f405", "h743"]
