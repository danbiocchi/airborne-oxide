name = "gps-loss-recovers"
about = "GPS lost for 4 s in Offboard: Hold while it is gone, then Offboard again at the setpoint."
airframe = "quad-x-5in"
duration_s = 45.0

[sim]
sensors = "realistic"
estimator = "ekf"

[sim.links]
gcs = false
brain = true
rc_failsafe_delay_us = 1000000

[wind]
kind = "random"
steady_speed_mps = [0.0, 2.0]
sigma_h_mps = [0.1, 0.4]
sigma_v_ratio = 0.5
tau_s = 2.0

[[fault]]
kind = "gps-loss"
start_s = 15.0
end_s = 19.0

[pilot]
arm_at_s = 3.0

[[pilot.mode]]
t = 0.0
switch = "offboard"

[[pilot.setpoint]]
t = 0.0
position = [0.0, 0.0, 0.0]
yaw = 0.0

[[pilot.setpoint]]
t = 4.0
position = [0.0, 0.0, 5.0]
yaw = 0.0

[expect]
nav_contains = ["offboard", "hold", "offboard"]
nav_never = ["rtl", "land", "land-now", "terminated"]
reasons = ["GPS_LOST"]
by_s = 45.0
max_touchdown_mps = 1.5
max_tilt_deg = 40.0
min_height_m = 4.0

[expect.ending]
kind = "flying"
point = [0.0, 0.0, 5.0]
tolerance_m = 2.0

[run]
seeds = 10
profiles = ["f405", "h743"]
