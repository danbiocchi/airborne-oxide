name = "brain-hang"
about = "The brain hangs (heartbeat continues, progress frozen, setpoints stop) 15 m out: Hold, then Rtl, and lands at home."
airframe = "quad-x-5in"
duration_s = 90.0

[sim]
sensors = "realistic"
estimator = "ekf"

[sim.links]
gcs = false
brain = true
rc_failsafe_delay_us = 1000000

[wind]
kind = "random"
steady_speed_mps = [0.0, 2.0]
sigma_h_mps = [0.1, 0.4]
sigma_v_ratio = 0.5
tau_s = 2.0

[[fault]]
kind = "brain-hang"
start_s = 20.0

[pilot]
arm_at_s = 3.0

[[pilot.mode]]
t = 0.0
switch = "offboard"

[[pilot.setpoint]]
t = 0.0
position = [0.0, 0.0, 0.0]
yaw = 0.0

[[pilot.setpoint]]
t = 4.0
position = [15.0, 0.0, 5.0]
yaw = 0.0

[expect]
nav_contains = ["hold", "rtl"]
reasons = ["BRAIN_LOST", "SETPOINT_STALE"]
by_s = 85.0
max_touchdown_mps = 1.5
max_tilt_deg = 40.0
min_height_m = 4.0

[expect.ending]
kind = "landed"
within_m_of_home = 2.0

[run]
seeds = 10
profiles = ["f405", "h743"]
