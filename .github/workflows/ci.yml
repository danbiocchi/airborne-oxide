# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TOOLCHAIN: "1.97.0"

jobs:
  lint:
    name: Format, clippy, no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy --target thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Flight core builds for the STM32 target (no_std, no alloc)
        run: cargo build -p oxide-core --target thumbv7em-none-eabihf --release --locked
      - name: Parameter store builds for the STM32 target (no_std, no alloc)
        run: cargo build -p oxide-store --target thumbv7em-none-eabihf --release --locked
      - name: Log format layer builds for the STM32 target (no_std, no alloc)
        run: cargo build -p oxide-log --target thumbv7em-none-eabihf --release --locked

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "${{ env.TOOLCHAIN }}" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: Trace hashes of the canonical scenarios
        shell: bash
        run: |
          cargo run --release --locked -q -p oxide-sim-cli -- hash --profile f405 >  hashes.txt
          cargo run --release --locked -q -p oxide-sim-cli -- hash --profile h743 >> hashes.txt
          cat hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.os }}
          path: hashes.txt

  monte-carlo:
    name: Scenario files, Monte-Carlo (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Every scenario file on the seeds and profiles its [run] names (ADR-0004)
        # The 41 fault scenarios and pairings on 10 seeds, gust-hold on 200
        # (the M1b criteria), hover-step on 1, each on both profiles: 1222
        # flights, in parallel. Fails if any run fails.
        run: cargo run --release --locked -p oxide-sim-cli -- scenarios scenarios
      - name: The 129 pinned flights have not moved (ADR-0004 section 7)
        # The workspace tests check 43 of them; this is the full table. The
        # test is named so that the table's regenerator is not run.
        run: cargo test --release --locked -p oxide-sim --test scenario_files -- --ignored every_scenario_file_still_flies_its_pinned_flight_full
      - name: Every parameter flies at both ends of its range (no panic, no runaway)
        run: cargo test --release --locked -p oxide-sim --test param_bounds -- --ignored every_bound_flies
      - name: Every scenario file replays bit for bit on both profiles (ADR-0005 section 9)
        # Flies each of the 43 files with a replay-level log in memory, replays
        # it through a rebuilt core and fails on any tick that differs. Prints
        # one summary line (flights, ticks, bytes, seconds).
        run: cargo test --release --locked -p oxide-sim --test replay_sweep -- --ignored --nocapture every_scenario_file_replays_identically_on_both_profiles

  determinism:
    name: Linux and Windows traces are bit-identical
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hashes-*
          path: hashes
      - name: Compare (DESIGN §5.2 item 6)
        run: |
          cat hashes/hashes-ubuntu-latest/hashes.txt
          cat hashes/hashes-windows-latest/hashes.txt
          diff hashes/hashes-ubuntu-latest/hashes.txt hashes/hashes-windows-latest/hashes.txt

  pyulog:
    name: Logs are read by pyulog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyulog==1.3.0
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: The tests that use pyulog (ADR-0005 section 9)
        # OXIDE_PYTHON makes them run instead of printing a notice and skipping.
        run: |
          export OXIDE_PYTHON="$(command -v python)"
          cargo test --locked -p oxide-log pyulog
          cargo test --locked -p oxide-sim --test log_values
      - name: A log written by the command line, checked by pyulog
        # `runner` is a step-level context: not available in a job's `env:`.
        env:
          LOG_FILE: ${{ runner.temp }}/rc-loss-position.ulg
        run: |
          cargo run --release --locked -q -p oxide-sim-cli -- scenario rc-loss-position --log "$LOG_FILE"
          python tools/ulog_check.py "$LOG_FILE" --expect-topics sensor_combined,vehicle_angular_velocity,vehicle_rates_setpoint,actuator_motors,vehicle_thrust_setpoint,vehicle_torque_setpoint,vehicle_attitude,vehicle_attitude_setpoint,vehicle_local_position,vehicle_local_position_setpoint,manual_control_setpoint,vehicle_magnetometer,vehicle_air_data,battery_status,vehicle_status,failsafe_flags,oxide_status,oxide_estimator,oxide_event,oxide_logger
      - name: A replay-level log written by the command line, checked by pyulog and replayed
        env:
          LOG_FILE: ${{ runner.temp }}/rc-loss-position-replay.ulg
        run: |
          cargo run --release --locked -q -p oxide-sim-cli -- scenario rc-loss-position --log "$LOG_FILE" --log-level replay
          python tools/ulog_check.py "$LOG_FILE" --expect-topics sensor_combined,actuator_motors,vehicle_attitude,vehicle_status,oxide_status,oxide_event,oxide_logger,oxide_vehicle,oxide_param_us,oxide_boot,oxide_in_tick,oxide_in_imu,oxide_in_rc,oxide_in_battery,oxide_in_setpoint,oxide_in_gps,oxide_in_baro,oxide_in_mag,oxide_in_brain,oxide_out
          cargo run --release --locked -q -p oxide-sim-cli -- replay "$LOG_FILE"

  viewer:
    name: Viewer builds (Rerun + joystick)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q libudev-dev
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/oxide-viewer
      - run: cargo fmt --manifest-path crates/oxide-viewer/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path crates/oxide-viewer/Cargo.toml -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Viewer licences (tool-crate exceptions, DESIGN §10)
        working-directory: crates/oxide-viewer
        run: cargo deny check licenses bans sources

  deny:
    name: Licences, advisories, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses sources
